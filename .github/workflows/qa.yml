name: HelpDesk autotests

on:
  push:
  pull_request:

jobs:
    unit-integration:
    name: Unit и Integration (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Установка зависимостей
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Unit и integration тесты
        run: npm test

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    needs: unit-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Запуск тестового сервера
        run: |
          nohup npm run start:test > server.log 2>&1 &
      - name: Ожидание /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo "Сервер готов"
              exit 0
            fi
            sleep 2
          done
          echo "Сервер не ответил. Лог сервера:"
          cat server.log
          exit 1
      - name: Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          command: npm run e2e
      - name: Лог сервера при ошибке
        if: failure()
        run: cat server.log
      - name: Скриншоты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots