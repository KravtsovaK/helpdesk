name: HelpDesk autotests

on:
  push:
  pull_request:

jobs:
  unit-integration:
    name: Unit и Integration (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Unit and integration tests
        run: npm test

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    needs: unit-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: true
          start: npm run start:test
          wait-on: 'http://127.0.0.1:3000/api/health'
          wait-on-timeout: 60
          command: npm run e2e
      - name: Сохранить скриншоты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots